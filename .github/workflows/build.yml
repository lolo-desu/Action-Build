name: Build vrcrp website iOS IPA
on:
  push:
    branches: [vrcrp-web-ios]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check unread notification handling
        run: node scripts/test-notifications.cjs
      - name: Build arm64 device application
        run: bash scripts/build-unsigned.sh
      - name: Verify unsigned device binary
        run: |
          file build/Payload/ERPStable.app/ERPStable
          lipo build/Payload/ERPStable.app/ERPStable -verify_arch arm64
          if codesign -dv build/Payload/ERPStable.app 2>/dev/null; then
            echo 'Unexpected code signature' >&2
            exit 1
          fi
          unzip -t build/ERPStable-unsigned.ipa
          test -d build/Payload/ERPStable.app/LaunchScreen.storyboardc
          test -f build/Payload/ERPStable.app/AppIcon60x60@3x.png
          plutil -extract CFBundleDisplayName raw build/Payload/ERPStable.app/Info.plist
          shasum -a 256 build/ERPStable-unsigned.ipa > build/SHA256.txt
      - name: Check WebKit keyboard in iOS Simulator
        run: bash scripts/simulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vrcrp-web-unsigned
          path: |
            build/ERPStable-unsigned.ipa
            build/SHA256.txt
            build/layout-first.json
            build/layout-reopened.json
            build/web-keyboard.png
            build/web-login.png
            build/glass-tabs.json
            build/glass-modal.json
            build/glass-restored.json
            build/app-glass.png
          if-no-files-found: error
          retention-days: 30
