<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>
:root{--surface:255 255 255;--bg:236 241 248;--primary:237 83 82;--fg:39 51 73}*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#ecf1f8}.app-top{position:sticky;top:0;padding:16px;background:white;z-index:40}main{padding:12px}.heading{display:flex;align-items:center}button,a{font:16px system-ui;min-height:44px;padding:10px}a{display:block}.photo{display:block;width:100%;height:240px;padding:0;touch-action:none}.photo img{width:100%;height:100%;background:#dce9ff;object-fit:cover}.overflow-x-auto{overflow-x:auto;display:flex;gap:8px;touch-action:pan-y}.slide{flex:0 0 250px;height:90px;background:#fbdde2;display:grid;place-items:center}.sticky-report{position:fixed;top:48px;right:4px;z-index:46;background:white;font-size:10px;padding:4px;pointer-events:none}.bio{padding:16px;background:white}textarea{width:100%;font-size:16px}.chat-header{height:56px;background:white}.messages{height:150px;overflow-y:auto}.app-bottom{display:none}
</style></head><body><header class="app-top">触摸回归测试</header><main id="main"></main><script>
history.replaceState({idx:0,key:'gesture-root'},'',location.href);
window.openPage=path=>{history.pushState({idx:(history.state?.idx||0)+1,key:Math.random().toString()},'',path+'?fixture=gestures');render()};
function render(){const main=document.getElementById('main');window.scrollTo(0,0);const path=location.pathname;
if(path==='/matches')main.innerHTML='<h1>配对列表</h1><a href="/matches/thread" onclick="event.preventDefault();openPage(\'/matches/thread\')">虚构会话</a>';
else if(path==='/matches/thread')main.innerHTML='<header class="chat-header">聊天页面</header><div class="messages">虚构消息</div><a href="/u/peer" onclick="event.preventDefault();openPage(\'/u/peer\')">打开资料</a><textarea placeholder="消息"></textarea>';
else{main.innerHTML='<div class="heading"><h1>个人资料</h1></div><p id="ready">资料正在排版</p><button class="photo" aria-label="资料照片" onclick="document.getElementById(\'photo-count\').textContent=\'照片点击 1\'"><img draggable="true" alt="普通图片" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22100%22 height=%22100%22%3E%3Crect width=%22100%22 height=%22100%22 fill=%22%23dce9ff%22/%3E%3C/svg%3E"></button><p id="photo-count">照片点击 0</p><div class="overflow-x-auto" onscroll="document.getElementById(\'album-status\').textContent=\'相册位置 \'+Math.round(this.scrollLeft)"><div class="slide">相册 A</div><div class="slide">相册 B</div><div class="slide">相册 C</div></div><p id="album-status">相册位置 0</p><button onclick="webkit.messageHandlers.erpNativeApp.postMessage({kind:\'verifySnapshotStall\'})">冻结截图测试</button><article class="bio"><p>可复制的个人资料文字</p>'+Array.from({length:35},(_,i)=>'<p>资料内容 '+i+'</p>').join('')+'<p>资料最后一段</p></article><span class="sticky-report" id="scroll-status">页面滚动 0</span>';
setTimeout(()=>{if(location.pathname==='/u/peer')document.getElementById('ready').textContent='资料已就绪'},2100)}
}
window.addEventListener('popstate',render);window.addEventListener('scroll',()=>{const el=document.getElementById('scroll-status');if(el)el.textContent='页面滚动 '+Math.round(window.scrollY)},{passive:true});render();
</script></body></html>
