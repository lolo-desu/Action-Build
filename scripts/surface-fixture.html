<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--surface:255 255 255;--bg:255 235 117;--primary:172 55 129;--fg:30 30 30;--muted:118 130 151}*{box-sizing:border-box}html,body{margin:0;background:rgb(var(--bg));font:14px system-ui}.app-top{height:56px;position:sticky;top:0;z-index:40;background:rgb(var(--surface));padding:16px;border-bottom:2px solid #222}#main{padding:16px 12px;min-height:400px}.page-title{margin:0}.heading{display:flex;align-items:center;gap:12px;margin-bottom:16px}.card{background:white;border:2px solid #222;border-radius:16px;padding:12px}.flex{display:flex}.items-center{align-items:center}.gap-2{gap:8px}.mb-2{margin-bottom:8px}.p-2{padding:8px}.h-dvh{height:100dvh}.shell{display:flex;flex-direction:column}.shell.h-dvh #main{display:flex;flex:1;min-height:0}.chat{display:flex;flex:1;min-height:0;flex-direction:column}.messages{flex:1;min-height:0;overflow:auto;background:white;border:2px solid #222;border-radius:16px;padding:12px}.composer{display:flex;gap:8px;flex-shrink:0;margin-top:12px}textarea{height:44px;flex:1;min-width:0;font:16px system-ui}button{font:14px system-ui;min-height:44px;border:1px solid #222;border-radius:10px;background:#fff;padding:8px}.photo{width:40px;height:40px;border-radius:20px;background:#222;color:white;display:grid;place-items:center}.chat a{display:flex;align-items:center;gap:8px;color:#222;text-decoration:none}.stage{height:350px;touch-action:none;background:#fff;border:2px solid #222}.fixed{position:fixed}.inset-0{inset:0}.overflow-y-auto{overflow-y:auto}.overscroll-contain{overscroll-behavior:contain}.profile-overlay{z-index:50;background:white}.sticky{position:sticky;top:0;padding:8px;background:white;z-index:2}.profile-body{padding:16px;min-height:900px}
</style></head><body><div class="shell"><header class="app-top">网站顶栏</header><main id="main"></main></div><script>
history.replaceState({idx:0,key:'surface-root'},'',location.href);
window.fixtureRefreshes=0;window.__vrcrpSiteCache={refreshList:async()=>{fixtureRefreshes++;await new Promise(r=>setTimeout(r,300));return true},refreshPage:async()=>{fixtureRefreshes++;return true}};
function openPage(path){history.pushState({idx:(history.state?.idx||0)+1,key:Math.random().toString()},'',path);render()}
window.__surfaceOpen=openPage;
function render(){const path=location.pathname,chat=/^\/matches\/[^/]+$/.test(path),main=document.getElementById('main');document.querySelector('.shell').classList.toggle('h-dvh',chat);
if(chat)main.innerHTML='<section class="chat"><div class="card mb-2 flex items-center gap-2 p-2"><button aria-label="返回" onclick="__surfaceOpen(\'/matches\')">‹</button><a href="/u/peer" onclick="event.preventDefault();__surfaceOpen(\'/u/peer\')"><span class="photo">人</span><strong>测试联系人</strong></a></div><div class="messages"><p>测试消息</p></div><form class="composer"><textarea placeholder="消息"></textarea><button type="button">发送</button></form></section>';
else if(path.startsWith('/profile/edit'))main.innerHTML='<div class="heading flex items-center"><div><h1 class="page-title">编辑名片</h1></div></div><nav role="tablist"><button role="tab" onclick="__surfaceOpen(\'/profile/edit/basics\')">基本信息</button><button role="tab" onclick="__surfaceOpen(\'/profile/edit/about\')">简介</button><button role="tab" onclick="__surfaceOpen(\'/profile/edit/photos\')">照片</button></nav><section class="card"><label>简介 <textarea placeholder="简介"></textarea></label><p>名片编辑测试内容</p></section>';
else if(path==='/u/peer')main.innerHTML='<div class="heading flex items-center"><button aria-label="返回" onclick="__vrcrpBack()">‹</button><div><h1 class="page-title">测试联系人的名片</h1></div></div><article class="card"><p>可选择的名片简介</p><div style="height:700px">名片详情</div></article>';
else if(path==='/discover')main.innerHTML='<h1>探索</h1><div class="stage"><button onclick="__surfaceOverlay()">查看名片</button></div>';
else main.innerHTML='<h1>列表测试</h1><button onclick="__surfaceOpen(\'/profile/edit/basics\')">编辑名片</button><button onclick="__surfaceOpen(\'/matches/thread\')">聊天</button><button aria-label="加入主屏幕">加入主屏幕</button><article class="card" style="height:900px">列表内容</article>';}
window.__surfaceOverlay=()=>{const div=document.createElement('div');div.className='fixed inset-0 overflow-y-auto overscroll-contain profile-overlay';div.innerHTML='<div class="sticky"><button aria-label="关闭" onclick="this.closest(\'.profile-overlay\').remove()">关闭</button></div><article class="profile-body"><h1>卡片名片详情</h1><p>当前页面展开的个人资料</p></article>';document.getElementById('main').appendChild(div)};
window.addEventListener('popstate',render);render();
</script></body></html>
